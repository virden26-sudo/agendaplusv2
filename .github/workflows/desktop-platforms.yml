name: Linux and macOS desktop verification
on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifacts: electron/dist/*.AppImage
          - os: macos-15
            platform: mac
            artifacts: electron/dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - run: npm ci
      - run: npm --prefix electron ci
      - run: npm run electron:build:${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:backend
      - name: Smoke test Linux package
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm --prefix electron run test:smoke
        env:
          AGENDA_SMOKE_NO_SANDBOX: '1'
      - name: Smoke test macOS package
        if: runner.os == 'macOS'
        run: npm --prefix electron run test:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: agenda-${{ matrix.platform }}-verification
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
