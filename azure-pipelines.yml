trigger:
  - main
pool:
  vmImage: ubuntu-latest
steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: Install Node.js
  - script: npm ci
    displayName: Install locked dependencies
  - script: npm run test:unit && npm run typecheck && npm run lint
    displayName: Validate source
  - script: npm run build
    displayName: Build static frontend
  - script: npx playwright install --with-deps chromium && npm run test:prod
    displayName: Test production frontend
